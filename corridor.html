<style>
  :root{
    --bg:#1e1b2c; --surface:#393047; --surface-2:#5a356a; --sep:rgba(236,193,194,.42);
    --text:#ecc1c2; --text-2:#cda6b5; --amber:#f49c58; --amber-dk:#1e1b2c; --tint:#f49c58; --rose:#ecc1c2; --orange:#f49c58; --crimson:#c07184; --plum:#67264f; --violet:#5a356a; --ink:#1e1b2c;
    --measure:900px; --nav-h:54px;
    --font:"Source Sans 3","Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
    --font-head:"Literata",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:var(--font);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;
    overflow:hidden;-webkit-text-size-adjust:100%}
  .shell{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
  .shell.dim #content{filter:brightness(var(--bright,1))}

  .btn{flex:none;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:0 14px;font-family:var(--font);font-size:17px;font-weight:600;letter-spacing:-.01em;
    color:var(--text);background:transparent;border:1px solid transparent;border-radius:0;cursor:pointer;touch-action:manipulation}
  .btn:hover{background:var(--surface-2)}
  .btn:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
  .btn:disabled{opacity:.32;cursor:default}.btn:disabled:hover{background:transparent}
  .btn.tinted{color:var(--tint)} .btn.filled{background:var(--tint);color:var(--amber-dk)}
  .btn.filled:disabled{background:var(--surface-2);color:var(--text-2)}
  .btn.bordered{border-color:var(--sep);background:var(--surface)} .btn.bordered:hover{border-color:var(--tint)}
  .ico{display:inline-flex;align-items:center;flex:none} .ico svg{width:22px;height:22px;stroke-width:1.7;display:block}

  #topnav{flex:none;height:var(--nav-h);display:flex;align-items:center;gap:6px;padding:0 8px 0 4px;
    background:var(--surface);border-bottom:1px solid var(--sep)}
  #backBtn{flex:none;min-height:44px;display:inline-flex;align-items:center;gap:2px;padding:0 8px 0 4px;
    background:transparent;border:0;color:var(--tint);cursor:pointer;font-family:var(--font);font-size:17px;
    font-weight:500;letter-spacing:-.01em;touch-action:manipulation}
  #backBtn:hover{background:var(--surface-2)} #backBtn:focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
  #backBtn svg{width:24px;height:24px;stroke-width:2}
  @media(max-width:620px){ #backBtn .lab{display:none} }

  .titlewrap{flex:1;min-width:0;position:relative}
  #titleBtn{display:inline-flex;align-items:center;gap:5px;max-width:100%;min-height:44px;padding:0 8px;
    background:transparent;border:0;color:var(--text);cursor:pointer;font-family:var(--font);font-size:18px;
    font-weight:600;letter-spacing:-.02em;touch-action:manipulation}
  #titleBtn:hover{background:var(--surface-2)} #titleBtn:focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
  #titleBtn b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #titleBtn .caret{flex:none;color:var(--text-2);display:inline-flex} #titleBtn .caret svg{width:18px;height:18px;stroke-width:2}
  #titleBtn.static{cursor:default;pointer-events:none} #titleBtn.static:hover{background:transparent}

  .seg{flex:none;display:flex;border:1px solid var(--sep);overflow:hidden}
  .seg button{min-height:38px;padding:0 12px;font-family:var(--font);font-size:14px;font-weight:600;
    letter-spacing:-.005em;background:transparent;color:var(--text-2);border:0;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;touch-action:manipulation}
  .seg button svg{width:19px;height:19px;display:block}
  .seg button[aria-pressed="true"]{background:var(--tint);color:var(--amber-dk)}
  .seg button:focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
  @media(max-width:600px){ .seg .lab{display:none} .seg button{padding:0 11px} }

  #content{flex:1;min-height:0;position:relative}
  .shell[data-mode="pages"] #vp{display:none} .shell[data-mode="scroll"] #stage{display:none}
  .shell[data-mode="scroll"] #cardview{display:none}
  #vp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none} #vp::-webkit-scrollbar{display:none}
  #layer{transform-origin:0 0}
  .panel{display:block;position:relative;background:var(--surface);margin:0 auto;width:100%;max-width:var(--measure)}
  .panel img{display:block;width:100%;height:auto}
  .panel.pending::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
    border:2px solid var(--sep);border-top-color:var(--tint);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
  #titleBtn b,.card .big,.endwrap h2,#peekChap{font-family:var(--font-head);font-weight:600}
  #stage img{display:block;max-width:min(100%,var(--measure));max-height:100%;width:auto;height:auto;transform-origin:center center}
  #stage.loading::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;
    border:2px solid var(--sep);border-top-color:var(--tint);border-radius:50%;animation:spin .8s linear infinite}

  /* interstitial card view (pages mode) */
  #cardview{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;overflow:auto}
  .shell.oncard[data-mode="pages"] #stage{display:none}
  .shell.oncard[data-mode="pages"] #cardview{display:flex}

  /* card + endcap shared look */
  .card{margin:0 auto;max-width:var(--measure);text-align:center}
  .card .eyebrow{font-size:16px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--text-2);margin:0 0 18px}
  .card .big{font-size:clamp(34px,7vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:0}
  .card .go{margin-top:30px}
  .card .go button{min-height:50px;padding:0 26px;font-size:18px;font-weight:600;letter-spacing:-.01em;
    background:var(--tint);color:var(--amber-dk);border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .card .go button:hover{filter:brightness(1.06)} .card .go button svg{width:22px;height:22px;stroke-width:2}
  .endcap{margin:0 auto;max-width:var(--measure);padding:70px 24px 60px;text-align:center}
  .endcap .fin{font-size:clamp(30px,6vw,50px);font-weight:800;letter-spacing:-.03em;margin:0 0 28px;line-height:1.04}
  .endcap .by{font-size:17px;color:var(--text-2);margin:0 0 4px}
  .endcap .who{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:0 0 2px;line-height:1.1}
  .endcap .who a{color:var(--amber);text-decoration:none} .endcap .who a:hover{text-decoration:underline}
  .endcap .links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:28px 0 0}
  .endcap .links a{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:600;letter-spacing:-.01em;
    padding:14px 20px;border:1px solid var(--sep);color:var(--text);text-decoration:none}
  .endcap .links a:hover{border-color:var(--tint);color:var(--tint)}
  .endcap .links a.acc{background:var(--tint);border-color:var(--tint);color:var(--amber-dk)} .endcap .links a.acc:hover{filter:brightness(1.06)}
  .endcap .links svg{width:20px;height:20px;stroke-width:1.7}

  #botnav{flex:none;min-height:var(--nav-h);display:flex;align-items:center;gap:8px;padding:0 8px;
    background:var(--surface);border-top:1px solid var(--sep);position:relative}
  #scrubZone{flex:1;min-width:0;position:relative;height:44px;display:flex;align-items:center;cursor:pointer;touch-action:none;padding:0 8px}
  #track{position:relative;width:100%;height:6px;background:var(--plum);transition:height .16s cubic-bezier(.2,.8,.3,1)}
  #scrubZone.live #track{height:16px}
  #fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--tint)}
  #knob{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;background:var(--tint);transition:width .16s,height .16s,margin .16s}
  #scrubZone.live #knob{width:26px;height:26px;margin:-13px 0 0 -13px}
  .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--crimson);opacity:.85}
  #peek{position:absolute;bottom:calc(100% + 14px);left:0;z-index:60;transform:translateX(-50%) translateY(8px) scale(.94);
    transform-origin:50% 100%;opacity:0;pointer-events:none;transition:opacity .14s,transform .16s cubic-bezier(.2,.8,.3,1);
    background:var(--surface-2);border:1px solid var(--sep);padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.7)}
  #peek.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  #peek img{display:block;width:118px;height:auto;max-height:190px;object-fit:cover;object-position:top;background:var(--surface)}
  #peek .cap{margin-top:5px;text-align:center;font-size:16px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  #peek .chap{display:block;font-size:15px;font-weight:400;color:var(--text-2);margin-top:1px}

  /* size dial */
  .sizewrap{flex:none;display:flex;align-items:center}
  .sizebtn{min-width:40px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid var(--sep);color:var(--text);cursor:pointer;font-family:var(--font);
    font-size:17px;font-weight:700;touch-action:manipulation}
  .sizebtn:hover{border-color:var(--tint);color:var(--tint)} .sizebtn:disabled{opacity:.3;cursor:default}
  .sizebtn:focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
  .sizebtn.minus{border-right:0} .sizebtn .sm{font-size:13px} .sizebtn .lg{font-size:20px}
  #countTxt{flex:none;font-size:16px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums;
    min-width:64px;text-align:center;padding:0 4px}
  @media(max-width:560px){ #countTxt{min-width:52px;font-size:15px} }
  @media(max-width:420px){ .sizewrap{display:none} }

  .popwrap{position:relative;flex:none}
  .pop{position:absolute;background:var(--surface);border:1px solid var(--sep);padding:6px;display:none;flex-direction:column;gap:1px;
    box-shadow:0 20px 48px rgba(0,0,0,.7);z-index:80;max-height:min(74vh,600px);overflow-y:auto}
  .pop.open{display:flex} #opts{top:calc(100% + 8px);right:0;width:300px} #chapMenu{top:calc(100% + 6px);left:0;width:min(280px,86vw)}
  .pop button{width:100%;justify-content:flex-start;min-height:48px;font-weight:500}
  .pop .lbl{font-size:15px;font-weight:600;color:var(--text-2);padding:14px 14px 6px}
  .pop .sep{border-top:1px solid var(--sep);margin:6px 0}
  .pop .sliderrow{display:flex;align-items:center;gap:12px;padding:4px 14px 12px} .pop .sliderrow input{flex:1;accent-color:var(--tint);min-height:44px}
  .pop .sliderrow span{font-size:17px;color:var(--text-2);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
  .chapitem{display:flex;align-items:baseline;gap:10px} .chapitem .rng{margin-left:auto;font-size:15px;color:var(--text-2);font-variant-numeric:tabular-nums}
  .chapitem[aria-current="true"]{color:var(--tint)}

  .sheet{position:fixed;inset:0;z-index:95;background:rgba(30,27,44,.985);display:none;flex-direction:column} .sheet.open{display:flex}
  .sheethead{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--sep)}
  .sheethead h2{flex:1;margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}
  .sheetbody{flex:1;min-height:0;overflow-y:auto;padding:16px}
  #thumbs .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
  .thumb{position:relative;padding:0;border:1px solid var(--sep);background:var(--surface);cursor:pointer;overflow:hidden;display:block;width:100%;min-height:120px}
  .thumb img{display:block;width:100%;height:auto}
  .thumb .n{position:absolute;left:0;bottom:0;background:rgba(30,27,44,.9);color:var(--text);font-size:15px;font-weight:600;padding:2px 7px;font-variant-numeric:tabular-nums}
  .thumb[aria-current="true"]{outline:2px solid var(--tint);outline-offset:-2px} .thumb.marked .n{color:var(--amber)}
  .thumb:focus-visible{outline:2px solid var(--tint);outline-offset:1px}
  .thumbchap{grid-column:1/-1;margin:12px 0 0;font-size:18px;font-weight:600;letter-spacing:-.02em;color:var(--amber);border-bottom:1px solid var(--sep);padding-bottom:8px}
  #help dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:12px 18px;align-items:baseline}
  #help dt{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:16px;color:var(--amber);white-space:nowrap}
  #help dd{margin:0;font-size:17px;color:var(--text-2)}
  #help h3{margin:22px 0 10px;font-size:18px;font-weight:600;letter-spacing:-.02em} #help h3:first-child{margin-top:0}
  #marks .empty{color:var(--text-2);font-size:17px} #marks ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  #marks li{display:flex;align-items:center;gap:12px;border:1px solid var(--sep);padding:10px 12px} #marks li b{flex:1;font-size:17px;font-weight:600} #marks li span{font-size:16px;color:var(--text-2)}

  #toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 22px);transform:translateX(-50%) translateY(6px);z-index:97;
    background:var(--surface-2);border:1px solid var(--sep);font-size:17px;padding:12px 20px;opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;max-width:80%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){ #peek,#track,#knob,#toast,.panel.pending::after,#stage.loading::after{transition:none;animation:none} }

  /* --- mobile --- */
  @media(max-width:560px){
    #prevBtn .lab,#nextBtn .lab{display:none}
    #prevBtn,#nextBtn{padding:0 14px}
    #countBtn{padding:0 8px}
    #countTxt{min-width:44px}
    #scrubZone{min-width:120px}
  }
  @media(max-width:520px){ #byline{display:none} }
  @media(pointer:coarse){
    #topnav button,#botnav button,.seg button{min-height:44px}
    .seg button{min-width:44px}
    #backBtn{min-width:44px}
  }
</style>

    document.getElementById("mScroll").setAttribute("aria-pressed",String(m==="scroll"));

    document.getElementById("oFit").setAttribute("aria-pressed",String(fit));
    document.getElementById("oTap").setAttribute("aria-pressed",String(tapAdvance));

  }
  document.getElementById("mScroll").addEventListener("click",function(e){e.stopPropagation();setMode("scroll");});

  vp.addEventListener("click",function(){ if(mode!=="scroll"||!tapAdvance){return;} if(moved||scrolling||Date.now()-dt>400){return;} step(1); });

  /* ---------- popovers ---------- */
  var optBtn=document.getElementById("optBtn"),opts=document.getElementById("opts"),titleBtn=document.getElementById("titleBtn"),chapMenu=document.getElementById("chapMenu");
  function closeAllPops(){ opts.classList.remove("open");optBtn.setAttribute("aria-expanded","false");chapMenu.classList.remove("open");titleBtn.setAttribute("aria-expanded","false"); }

  opts.addEventListener("click",function(e){e.stopPropagation();});

    chapMenu.addEventListener("click",function(e){e.stopPropagation();}); }
  document.addEventListener("click",closeAllPops);

  document.getElementById("bright").addEventListener("input",function(){ var v=+this.value;shell.style.setProperty("--bright",(v/100).toFixed(2));shell.classList.toggle("dim",v<100);document.getElementById("brightVal").textContent=v+"%"; });
  document.getElementById("oFit").addEventListener("click",function(e){ e.stopPropagation();fit=!fit;this.setAttribute("aria-pressed",String(fit));cur().fit=fit;saveCur();if(mode==="pages"&&!onCard){renderPage();}toast(fit?"Fit page to screen":"Full width"); });
  document.getElementById("oTap").addEventListener("click",function(e){ e.stopPropagation();tapAdvance=!tapAdvance;this.setAttribute("aria-pressed",String(tapAdvance));cur().tapAdvance=tapAdvance;saveCur();toast(tapAdvance?"Tapping the art advances":"Tapping the art does nothing"); });

  /* ---------- sheets ---------- */
  function openSheet(id){ document.querySelectorAll(".sheet").forEach(function(s){s.classList.remove("open");});document.getElementById(id).classList.add("open");closeAllPops(); }
  function closeSheets(){ document.querySelectorAll(".sheet").forEach(function(s){s.classList.remove("open");}); }
  ["thumbsClose","helpClose","marksClose"].forEach(function(id){ document.getElementById(id).addEventListener("click",function(e){e.stopPropagation();closeSheets();}); });
  document.querySelectorAll(".sheet").forEach(function(s){s.addEventListener("click",function(e){e.stopPropagation();});});
  document.getElementById("oThumbs").addEventListener("click",function(e){ e.stopPropagation();updateThumbCurrent();openSheet("thumbs");
    var c=document.querySelector('.thumb[aria-current="true"]'); if(c){c.scrollIntoView({block:"center"});} });
  function updateThumbCurrent(){ var c=currentIndex(); thumbs.forEach(function(t,i){ if(!t){return;} t.setAttribute("aria-current",i===c&&!onCard?"true":"false");t.classList.toggle("marked",marks.indexOf(i)>=0); }); }

  function updateMarkLabel(){ var on=marks.indexOf(currentIndex())>=0 && !onCard;var t=document.getElementById("oMark").querySelector(".mtxt");if(t){ t.textContent=on?"Remove bookmark":"Bookmark this page"; } }
  function toggleMark(){ if(onCard){return;} var i=currentIndex(),at=marks.indexOf(i);
    if(at>=0){marks.splice(at,1);toast("Bookmark removed");} else{marks.push(i);marks.sort(function(a,b){return a-b;});toast("Bookmarked page "+(i+1));}
    wr(K_MARKS,marks);syncNav();renderMarks(); }
  document.getElementById("oMark").addEventListener("click",function(e){e.stopPropagation();closeAllPops();toggleMark();});
  function renderMarks(){ var b=document.getElementById("marksBody");
    if(!marks.length){ b.innerHTML='<p class="empty">No bookmarks yet. Press B to mark a page.</p>'; return; }
    b.textContent="";var ul=document.createElement("ul");
    marks.forEach(function(i){ var li=document.createElement("li");
      var t=document.createElement("b");t.textContent="Page "+(i+1);
      var s=document.createElement("span");s.textContent=MULTI?CHAPTERS[PAGES[i].chapter].title:"";
      var g=document.createElement("button");g.className="btn filled";g.textContent="Go";g.addEventListener("click",function(){go(i);closeSheets();});
      var r=document.createElement("button");r.className="btn";r.textContent="Remove";r.addEventListener("click",function(){ marks.splice(marks.indexOf(i),1);wr(K_MARKS,marks);syncNav();renderMarks(); });
      li.appendChild(t);li.appendChild(s);li.appendChild(g);li.appendChild(r);ul.appendChild(li); });
    b.appendChild(ul); }
  document.getElementById("oMarks").addEventListener("click",function(e){e.stopPropagation();renderMarks();openSheet("marks");});

  var SHORTCUTS={
    pages:[["Reading",[["Right arrow, Space","Next"],["Left arrow","Previous"],["Home, End","First or last page"]]],
           ["View",[["V","Switch to Scroll"],["Up, Down","Jump a row (grid sets)"],["Plus, Minus","Zoom the current page"],["0","Reset zoom"],["Control and scroll wheel","Zoom"],["Wheel over the page bar","Previous / next page"],["F","Fullscreen"]]],
           ["Tools",[["T","All pages"],["B","Bookmark this page"],["Question mark","This list"],["Escape","Close"]]]],
    scroll:[["Reading",[["Space","Advance three quarters of a screen"],["Up, Down","Advance or go back"],["Home, End","Start or end"]]],
           ["View",[["V","Switch to Pages"],["Control and scroll wheel","Zoom"],["Wheel over the page bar","Previous / next page"],["F","Fullscreen"]]],
           ["Tools",[["T","All pages"],["B","Bookmark this page"],["Question mark","This list"],["Escape","Close"]]]]
  };
  function renderHelp(){ var b=document.getElementById("helpBody");b.textContent="";
    SHORTCUTS[mode].forEach(function(sec){ var h=document.createElement("h3");h.textContent=sec[0];b.appendChild(h);
      var dl=document.createElement("dl"); sec[1].forEach(function(r){ var dt=document.createElement("dt");dt.textContent=r[0];var dd=document.createElement("dd");dd.textContent=r[1];dl.appendChild(dt);dl.appendChild(dd); }); b.appendChild(dl); }); }
  document.getElementById("oHelp").addEventListener("click",function(e){e.stopPropagation();renderHelp();openSheet("help");});

  function toggleFull(){ if(!document.fullscreenElement){ if(shell.requestFullscreen){ shell.requestFullscreen().catch(function(){toast("Fullscreen isn't available here");}); } else { toast("Fullscreen isn't supported in this browser"); } } else { document.exitFullscreen(); } }
  document.getElementById("oFull").addEventListener("click",function(e){e.stopPropagation();closeAllPops();toggleFull();});

  function setStripZoom(z,anchorY){ var prev=stripZoom;z=Math.max(1,Math.min(4,z)); if(z===prev){return;}
    var a=(anchorY==null?vp.clientHeight/2:anchorY),before=vp.scrollTop+a;stripZoom=z;layer.style.transform="scale("+z+")";layer.style.width=(100/z)+"%";
    vp.scrollTop=before*(z/prev)-a;toast(z===1?"Zoom reset":"Zoom "+z.toFixed(1)+"x"); }
  vp.addEventListener("wheel",function(e){ if(!e.ctrlKey){return;}
    e.preventDefault();
    if(mode==="scroll"){ setStripZoom(stripZoom*(e.deltaY<0?1.12:1/1.12),e.clientY); }
    else { setStageZoom(stageZoom*(e.deltaY<0?1.12:1/1.12)); }
  },{passive:false});
  // wheel over the page scrubber steps through pages; everywhere else the wheel scrolls normally
  zone.addEventListener("wheel",function(e){
    if(e.ctrlKey){return;}
    e.preventDefault();
    var d=(Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX);
    if(!d){return;}
    zscroll+=d;
    var step=Math.trunc(zscroll/40); if(!step){return;}
    zscroll-=step*40;
    var i=Math.max(0,Math.min(TOTAL-1,currentIndex()+step));
    if(i!==currentIndex()){ go(i); }
  },{passive:false});
  /* ---- zoom + pan (Panzoom, vendored; degrades to plain scale if absent) ---- */
  var pz=null;
  function killPanzoom(){ if(pz){ try{pz.destroy();}catch(_){} pz=null; } }
  function attachPanzoom(im){ killPanzoom(); im.style.transform="scale("+stageZoom+")"; syncZoomCursor(); }
  function syncZoomCursor(){ var im=stage.querySelector("img"); if(im){ im.style.cursor = stageZoom>1.01?"grab":"auto"; } }
  function setStageZoom(z){ if(onCard){return;}
    stageZoom=Math.max(1,Math.min(6,z));
    var im=stage.querySelector("img"); if(im){ im.style.transform="scale("+stageZoom+")"; }
    syncZoomCursor();
    toast(stageZoom===1?"Zoom reset":"Zoom "+stageZoom.toFixed(1)+"x"); }

  /* ---- grid navigation: left/right = one step, up/down = one row ---- */
  function gridInfo(){
    if(mode!=="pages"||onCard){ return null; }
    var c=CHAPTERS[PAGES[page].chapter];
    if(!c||!c.grid||!c.grid.cols){ return null; }
    var cols=c.grid.cols, local=page-c.from, span=c.to-c.from+1;
    return {c:c,cols:cols,local:local,span:span,rows:Math.ceil(span/cols),
            row:Math.floor(local/cols),col:local%cols};
  }
  function gridStep(dRow){
    var g=gridInfo(); if(!g){ return false; }
    var row=g.row+dRow;
    if(row<0||row>=g.rows){ toast(dRow<0?"Top row":"Bottom row"); return true; }
    var target=row*g.cols+g.col;
    if(target>=g.span){ toast("No panel there"); return true; }
    go(g.c.from+target);
    var n=gridInfo();
    if(n){ toast("Row "+(n.row+1)+" / "+n.rows+"  ·  Col "+(n.col+1)+" / "+n.cols); }
    return true;
  }
  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey){return;} var tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"){return;}
    if(e.key==="?"){e.preventDefault();renderHelp();openSheet("help");return;}
    if(e.key==="t"||e.key==="T"){e.preventDefault();updateThumbCurrent();openSheet("thumbs");return;}
    if(e.key==="b"||e.key==="B"){e.preventDefault();toggleMark();return;}
    if(e.key==="v"||e.key==="V"){e.preventDefault();setMode(mode==="pages"?"scroll":"pages");return;}
    if(e.key==="f"||e.key==="F"){e.preventDefault();toggleFull();return;}
    if(e.key==="Escape"){ if(document.querySelector(".sheet.open")){closeSheets();} else {closeAllPops();} return; }
    if(mode==="pages"){ switch(e.key){
      case "ArrowRight":case " ":e.preventDefault();step(1);break; case "ArrowLeft":e.preventDefault();step(-1);break;
      case "ArrowDown":if(gridStep(1)){e.preventDefault();}break;
      case "ArrowUp":if(gridStep(-1)){e.preventDefault();}break;
      case "Home":e.preventDefault();go(0);break; case "End":e.preventDefault();go(TOTAL-1);break;
      case "+":case "=":e.preventDefault();setStageZoom(stageZoom*1.25);break; case "-":case "_":e.preventDefault();setStageZoom(stageZoom/1.25);break;
      case "0":e.preventDefault();setStageZoom(1);break; } return; }
    switch(e.key){ case " ":e.preventDefault();step(e.shiftKey?-1:1);break; case "ArrowDown":e.preventDefault();step(1);break;
      case "ArrowUp":e.preventDefault();step(-1);break; case "Home":e.preventDefault();vp.scrollTo({top:0,behavior:"smooth"});break;
      case "End":e.preventDefault();vp.scrollTo({top:maxScroll(),behavior:"smooth"});break; }
  });

  /* ---------- boot ---------- */
  paintIcons(document);
  buildScroll();buildChapMenu();buildThumbs();placeTicks();
  var savedPos=rd(K_POS,null); if(savedPos&&typeof savedPos.i==="number"){ page=Math.min(TOTAL-1,Math.max(0,savedPos.i)); }
  var savedMode=rd(K_MODE,(window.matchMedia&&matchMedia("(pointer:coarse)").matches)||navigator.maxTouchPoints>0?"scroll":"pages"); var s0=savedMode==="pages"?sPages:sScroll;
  fit=s0.fit!==false;tapAdvance=!!s0.tapAdvance;
  document.getElementById("oFit").setAttribute("aria-pressed",String(fit));
  document.getElementById("oTap").setAttribute("aria-pressed",String(tapAdvance));
  applySize(nearestWidthIndex(s0.measure||900),false);
  renderMarks();renderHelp();
  if(savedMode==="scroll"){ mode="pages";setMode("scroll"); } else { renderPage(); }
  setTimeout(function(){ if(mode==="scroll"){ if(nodes[page]){ vp.scrollTop=nodes[page].offsetTop; } } syncNav(); },60);
  window.addEventListener("resize",function(){ clearTimeout(window.__rz);window.__rz=setTimeout(function(){ syncNav(); },160); });
})();
